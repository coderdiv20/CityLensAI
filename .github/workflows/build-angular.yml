name: Angular Build
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    - name: Install deps
      run: |
        cd src/frontend-angular/frontend
        npm ci
    - name: Build
      run: |
        cd src/frontend-angular/frontend
        npm run build --if-present
