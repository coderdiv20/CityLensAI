name: Python Build & Test
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          pip install -r src/ai-services-python/vision-service/requirements.txt || true
      - name: Run tests
        run: |
          echo "Add pytest step when tests are present"